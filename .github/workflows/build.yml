name: Build macOS app
# jamalterm 4.x: the Rust app. A pushed commit titled "Release X.Y.Z" (or
# "Release X.Y.Z-beta.N" for the Beta channel), a v-tag, or a dispatch with a
# version builds that version and publishes it when every job passes, with
# a Sigstore build proof the updater checks (see the release skill).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'CLAUDE.md']
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version (e.g. 4.0.0). Leave empty for a test build."
        required: false
        default: ""
      prerelease:
        description: "A test version: only people on the Beta update channel get it (use a version like 4.0.0-beta.1)."
        type: boolean
        required: false
        default: false

permissions:
  contents: write     # to publish releases
  id-token: write     # to prove each build came from this workflow (Sigstore)
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Tests, real shells (zsh, bash, tcsh, fish) and the app's self-test
    # under a virtual display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: System libraries and shells
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh tcsh fish xvfb libxkbcommon-x11-0 libgl1 libegl1
          # The runner's shared zsh folders are group-writable, so compinit
          # stops to ask about them; a real Mac doesn't.
          zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod go-w || true
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Self-test (the real app)
        run: |
          cargo build --locked
          mkdir -p smoke/home
          HOME="$PWD/smoke/home" SHELL=/usr/bin/zsh JAMALTERM_SMOKE="$PWD/smoke" JAMALTERM_SETTINGS="$PWD/smoke/settings.json" \
            timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" target/debug/jamalterm
          cat smoke/report.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('smoke/report.json'))['ok'] else 1)"
      - name: Self-test, second run (the saved window comes back)
        run: |
          HOME="$PWD/smoke/home" SHELL=/usr/bin/zsh JAMALTERM_SMOKE="$PWD/smoke" JAMALTERM_SETTINGS="$PWD/smoke/settings.json" JAMALTERM_SMOKE_RESTORE=1 \
            timeout 60 xvfb-run -a -s "-screen 0 1400x900x24" target/debug/jamalterm
          cat smoke/report-restore.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('smoke/report-restore.json'))['ok'] else 1)"
      - name: Crash report (a crash on purpose is noticed at the next start)
        run: |
          export HOME="$PWD/smoke/home" SHELL=/usr/bin/zsh JAMALTERM_SETTINGS="$PWD/smoke/settings.json"
          JAMALTERM_TEST_CRASH=1 timeout 60 xvfb-run -a -s "-screen 0 1400x900x24" target/debug/jamalterm || true
          test -s smoke/crash.log
          JAMALTERM_SMOKE="$PWD/smoke" JAMALTERM_SMOKE_RESTORE=1 JAMALTERM_SMOKE_EXPECT_CRASH=1 \
            timeout 60 xvfb-run -a -s "-screen 0 1400x900x24" target/debug/jamalterm
          cat smoke/report-restore.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('smoke/report-restore.json'))['ok'] else 1)"
          grep -q "quit unexpectedly" smoke/problems.log

  shells:
    # Browse mode under oh-my-zsh, Powerlevel10k (instant prompt), prezto and
    # starship (zsh, bash, fish), on Linux and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install shells and setups
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -q && sudo apt-get install -y -q zsh fish
            # The runner's shared zsh folders are group-writable, so compinit
            # stops to ask about them; a real Mac doesn't.
            zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod go-w || true
            curl -sS https://starship.rs/install.sh | sh -s -- -y -b /usr/local/bin
          else
            brew install fish starship
          fi
          mkdir -p "$RUNNER_TEMP/setups" && cd "$RUNNER_TEMP/setups"
          git clone -q --depth 1 https://github.com/ohmyzsh/ohmyzsh.git
          git clone -q --depth 1 https://github.com/romkatv/powerlevel10k.git
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/sorin-ionescu/prezto.git
      - name: Test
        env: { JT_SHELL_SETUPS: "${{ runner.temp }}/setups" }
        run: cargo test --locked -- --nocapture real_shell

  macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: v
        env:
          INPUT_VERSION: "${{ inputs.version }}"
          # A pushed commit titled "Release 4.0.0" (or "Release 4.0.0-beta.1")
          # is built as that version and published if everything passes:
          # one pipeline, no second build.
          COMMIT_MSG: "${{ github.event.head_commit.message }}"
        run: |
          TITLE="${COMMIT_MSG%%$'\n'*}"
          RELEASE=false
          if [[ -n "$INPUT_VERSION" ]]; then V="${INPUT_VERSION#v}"; RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$TITLE" =~ ^Release\ v?([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?)$ ]]; then V="${BASH_REMATCH[1]}"; RELEASE=true
          else V="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $V (release: $RELEASE)"
      - name: Test (macOS zsh, bash 3.2, tcsh)
        run: cargo test --locked
      - name: Build jamalterm.app (Apple silicon + Intel)
        run: scripts/build-mac.sh "${{ steps.v.outputs.version }}"
      - name: Sign
        # Ad hoc unless signing secrets exist (scripts/sign-mac.sh explains).
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/sign-mac.sh build/bin/jamalterm.app
          lipo -archs build/bin/jamalterm.app/Contents/MacOS/jamalterm
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/bin/jamalterm.app/Contents/Info.plist
      - name: Self-test (the real app on this Mac)
        run: scripts/smoke-mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ steps.v.outputs.version }}
          path: smoke/
      - name: Make the disk image and the update zip
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir dmg
          cp -R build/bin/jamalterm.app dmg/
          ln -s /Applications dmg/Applications
          # Size the image explicitly: hdiutil's own estimate can come out too small.
          SIZE_MB=$(( $(du -sm dmg | cut -f1) * 3 / 2 + 20 ))
          hdiutil create -volname "jamalterm" -srcfolder dmg -fs HFS+ -size "${SIZE_MB}m" -ov -format UDZO "jamalterm-$V.dmg"
          ditto -c -k --keepParent build/bin/jamalterm.app "jamalterm-$V-macos.zip"
          shasum -a 256 jamalterm-*.dmg jamalterm-*.zip | tee SHA256SUMS.txt
      - name: Prove GitHub built it (Sigstore)
        if: github.event_name != 'pull_request'
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: jamalterm-${{ steps.v.outputs.version }}-macos.zip
      - name: Check the proof the way the updater will
        if: github.event_name != 'pull_request'
        run: |
          V="${{ steps.v.outputs.version }}"
          cp "${{ steps.attest.outputs.bundle-path }}" "jamalterm-$V-macos.zip.sigstore.json"
          JT_VERIFY_RELEASE="$PWD/jamalterm-$V-macos.zip $PWD/jamalterm-$V-macos.zip.sigstore.json $PWD/jamalterm-$V.dmg" \
            cargo test --locked -- --nocapture verify_release
      - uses: actions/upload-artifact@v4
        with:
          name: jamalterm-${{ steps.v.outputs.version }}
          path: |
            jamalterm-*.dmg
            jamalterm-*.zip
            jamalterm-*.sigstore.json
            SHA256SUMS.txt

  # Publishes the files the Mac job built and checked (no rebuild), once
  # every other job has passed too.
  publish:
    needs: [linux, macos, shells]
    if: needs.macos.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jamalterm-${{ needs.macos.outputs.version }}
      - name: Publish release
        env:
          GH_TOKEN: "${{ github.token }}"
          V: "${{ needs.macos.outputs.version }}"
          PRERELEASE: "${{ inputs.prerelease }}"
        run: |
          # Creates the v-tag on this commit if it doesn't exist yet.
          TAG="v$V"
          # Notes = this version's CHANGELOG section, then the install steps.
          section() { awk -v v="## $1" 'index($0, v)==1{on=1;next} /^## /{on=0} on' CHANGELOG.md; }
          # A test version (4.0.0-beta.1) uses its own section, or else 4.0.0's.
          NOTES=$(section "$V"); [[ -n "${NOTES//[[:space:]]/}" ]] || NOTES=$(section "${V%%-*}")
          # A version with a "-" (4.0.0-beta.1) goes to the Beta channel only.
          PRE=""; [[ "$PRERELEASE" == "true" || "$V" == *-* ]] && PRE="--prerelease"
          { echo "## What's new"; echo; echo "$NOTES"; echo; cat .github/release-notes.md; } > notes.md
          gh release create "$TAG" jamalterm-*.dmg jamalterm-*.zip jamalterm-*.sigstore.json SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "jamalterm $TAG" --notes-file notes.md $PRE
