[package]
name = "jamalterm"
version = "4.0.0-dev"
edition = "2024"
description = "A macOS terminal with a free-floating cursor (browse mode) and AI built in"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
arboard = "3"
anyhow = "1.0.104"
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.bundle]
name = "jamalterm"
identifier = "com.jamalxcode.jamalterm"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
# The window's view for the right-click menu, and native alerts (the same
# versions muda uses).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSRunningApplication"] }
