[package]
name = "jamalterm"
version = "4.0.0-dev"
edition = "2024"
description = "A macOS terminal with a free-floating cursor (browse mode) and AI built in"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
egui = "0.37"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
arboard = "3"
anyhow = "1.0.104"
png = "0.17"
# API keys: AES-256-GCM with an HKDF-SHA256 key (3.x's keys.enc format).
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
libc = "0.2"
# The AI panel: requests to the providers, secret hiding and risk checks.
ureq = { version = "3", default-features = false, features = ["json"] }
regex = "1"
# Inline images (the iTerm2 protocol imgcat uses), pure Rust decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# The updater's build-proof check (Sigstore), pure Rust.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.bundle]
name = "jamalterm"
identifier = "com.jamalxcode.jamalterm"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# Unzipping updates (on a Mac, ditto does it).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# On a Mac, HTTPS uses the system's TLS and trust store (Security framework).
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
muda = "0.21"
# The menu bar icon (it shares muda's menus and events).
tray-icon = { version = "0.26", default-features = false }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSettings", "UNNotificationTrigger"] }
# The window's view for the right-click menu, and native alerts (the same
# versions muda uses).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSBundle", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSRunningApplication", "NSAccessibility", "NSWorkspace", "NSScreen", "NSSound", "NSMenu", "NSMenuItem"] }
