name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write # to publish releases for v* tags

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The Info.plist version comes from wails.json.
          plistv="${V%%-*}"
          jq --arg v "$plistv" '.info.productVersion = $v' wails.json > wails.tmp && mv wails.tmp wails.json

      - name: Test (macOS zsh, bash 3.2, tcsh)
        run: go test -race ./internal/...
        env: { CGO_ENABLED: "1" }

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build jamalterm.app (Apple silicon + Intel)
        run: wails build -platform darwin/universal -clean -trimpath -ldflags "-X main.version=${{ steps.v.outputs.version }}"

      - name: Sign (ad hoc)
        # Not notarized: that needs a paid Apple Developer account.
        run: |
          codesign --force --deep --sign - build/bin/jamalterm.app
          codesign --verify --deep --strict build/bin/jamalterm.app
          lipo -archs build/bin/jamalterm.app/Contents/MacOS/jamalterm

      - name: Make the disk image
        run: |
          mkdir dmg
          cp -R build/bin/jamalterm.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "jamalterm" -srcfolder dmg -ov -format UDZO "jamalterm-${{ steps.v.outputs.version }}.dmg"
          ditto -c -k --keepParent build/bin/jamalterm.app "jamalterm-${{ steps.v.outputs.version }}-macos.zip"
          shasum -a 256 jamalterm-*.dmg jamalterm-*.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jamalterm-${{ steps.v.outputs.version }}
          path: |
            jamalterm-*.dmg
            jamalterm-*.zip
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" jamalterm-*.dmg jamalterm-*.zip SHA256SUMS.txt \
            --title "jamalterm $GITHUB_REF_NAME" --notes-file .github/release-notes.md
