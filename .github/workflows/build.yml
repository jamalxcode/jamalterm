name: Build macOS app
# jamalterm 4.x: the Rust app. Releases are switched off until it matches
# 3.5.0 (the last Go release): see docs/DESIGN.md, "Rust port". Publishing,
# the Sigstore build proof and its check come back with the updater.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CLAUDE.md']
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Tests, real shells (zsh, bash, tcsh, fish) and the app's self-test
    # under a virtual display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: System libraries and shells
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh tcsh fish xvfb libxkbcommon-x11-0 libgl1 libegl1
          # The runner's shared zsh folders are group-writable, so compinit
          # stops to ask about them; a real Mac doesn't.
          zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod go-w || true
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Self-test (the real app)
        run: |
          cargo build --locked
          mkdir -p smoke/home
          HOME="$PWD/smoke/home" SHELL=/usr/bin/zsh JAMALTERM_SMOKE="$PWD/smoke" JAMALTERM_SETTINGS="$PWD/smoke/settings.json" \
            timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" target/debug/jamalterm
          cat smoke/report.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('smoke/report.json'))['ok'] else 1)"

  shells:
    # Browse mode under oh-my-zsh, Powerlevel10k (instant prompt), prezto and
    # starship (zsh, bash, fish), on Linux and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install shells and setups
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -q && sudo apt-get install -y -q zsh fish
            # The runner's shared zsh folders are group-writable, so compinit
            # stops to ask about them; a real Mac doesn't.
            zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod go-w || true
            curl -sS https://starship.rs/install.sh | sh -s -- -y -b /usr/local/bin
          else
            brew install fish starship
          fi
          mkdir -p "$RUNNER_TEMP/setups" && cd "$RUNNER_TEMP/setups"
          git clone -q --depth 1 https://github.com/ohmyzsh/ohmyzsh.git
          git clone -q --depth 1 https://github.com/romkatv/powerlevel10k.git
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/sorin-ionescu/prezto.git
      - name: Test
        env: { JT_SHELL_SETUPS: "${{ runner.temp }}/setups" }
        run: cargo test --locked -- --nocapture real_shell

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test (macOS zsh, bash 3.2, tcsh)
        run: cargo test --locked
      - name: Build jamalterm.app (Apple silicon + Intel)
        run: scripts/build-mac.sh "0.0.0-dev.${GITHUB_SHA::7}"
      - name: Sign (ad hoc)
        run: |
          codesign --force --deep --sign - build/bin/jamalterm.app
          lipo -archs build/bin/jamalterm.app/Contents/MacOS/jamalterm
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/bin/jamalterm.app/Contents/Info.plist
      - name: Self-test (the real app on this Mac)
        run: scripts/smoke-mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jamalterm-dev-${{ github.sha }}
          path: |
            build/bin/jamalterm.app
            smoke/
